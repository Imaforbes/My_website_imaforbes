<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/icono.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio profesional de Imaforbes - Desarrollo web y diseño"
    />
    <title>Imaforbes</title>

    <!-- Preconnect to external domains for faster resource loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Inter:wght@300;400;500;600&display=swap" as="style" />
    <!-- Preload LCP hero image for better Web Vitals -->
    <script>
      // Apply theme immediately to prevent flash
      (function () {
        const root = document.documentElement;
        root.classList.add("dark");
        root.classList.remove("light");
        
        // Wait for body to exist before adding class
        if (document.body) {
          document.body.classList.add("dark-theme");
        } else {
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add("dark-theme");
          });
        }
      })();

      // Image Protection: Disable right-click and drag on protected images
      document.addEventListener("DOMContentLoaded", function () {
        // Prevent context menu on protected images
        document.addEventListener(
          "contextmenu",
          function (e) {
            if (
              e.target.tagName === "IMG" &&
              e.target.classList.contains("protected-image")
            ) {
              e.preventDefault();
              return false;
            }
          },
          false
        );

        // Prevent drag and drop of protected images
        document.addEventListener(
          "dragstart",
          function (e) {
            if (
              e.target.tagName === "IMG" &&
              e.target.classList.contains("protected-image")
            ) {
              e.preventDefault();
              return false;
            }
          },
          false
        );
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Defer script loading for better performance -->
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
